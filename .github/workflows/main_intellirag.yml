name: Build and deploy Python app to Azure Web App - IntelliRAG

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A663AF96D43043B68F6B8E7AAB0F4823 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0E618CD5C6354652AAC55AC1EF46159F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A1C9B2D33592460087B5E9975A94247F }}

      - name: Deploy to Azure Web App (Source Build)
        uses: azure/webapps-deploy@v3
        with:
          app-name: IntelliRAG
          slot-name: Production
          scm-do-build-during-deployment: true
